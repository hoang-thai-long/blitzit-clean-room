name: daylight
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DAYLIGHT_DB_NAME:-daylight}
      POSTGRES_USER: ${DAYLIGHT_DB_USER:-daylight}
      POSTGRES_PASSWORD: ${DAYLIGHT_DB_PASSWORD:?Set DAYLIGHT_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DAYLIGHT_DB_PORT:-54329}:5432"
    volumes:
      - daylight-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      NODE_ENV: production
      DAYLIGHT_API_HOST: 0.0.0.0
      DAYLIGHT_API_PORT: ${DAYLIGHT_API_PORT:-3001}
      DAYLIGHT_API_CORS_ORIGINS: ${DAYLIGHT_API_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
      DAYLIGHT_API_TIME_ZONE: ${DAYLIGHT_API_TIME_ZONE:-Asia/Ho_Chi_Minh}
      DAYLIGHT_API_LOG_LEVEL: ${DAYLIGHT_API_LOG_LEVEL:-info}
      DAYLIGHT_DB_HOST: postgres
      DAYLIGHT_DB_PORT: 5432
      DAYLIGHT_DB_NAME: ${DAYLIGHT_DB_NAME:-daylight}
      DAYLIGHT_DB_USER: ${DAYLIGHT_DB_USER:-daylight}
      DAYLIGHT_DB_PASSWORD: ${DAYLIGHT_DB_PASSWORD:?Set DAYLIGHT_DB_PASSWORD in .env}
      DAYLIGHT_DB_POOL_MAX: ${DAYLIGHT_DB_POOL_MAX:-8}
    ports:
      - "127.0.0.1:${DAYLIGHT_API_PORT:-3001}:${DAYLIGHT_API_PORT:-3001}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.DAYLIGHT_API_PORT+'/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 10s
    restart: unless-stopped
volumes:
  daylight-postgres:
